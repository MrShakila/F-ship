[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fship"
version = "0.1.1"
description = "Flutter Ship — orchestrate release workflows to Firebase App Distribution"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Shakila", email = "shadikari012@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
]

[project.urls]
Homepage = "https://github.com/MrShakila/F-ship"
Repository = "https://github.com/MrShakila/F-ship"
Issues = "https://github.com/MrShakila/F-ship/issues"

[project.scripts]
fship = "fship.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fship"]
