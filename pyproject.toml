[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fship"
version = "0.9.2"
description = "Flutter Ship — orchestrate release workflows to Firebase App Distribution"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Shakila", email = "shadikari012@gmail.com"}]
license = {file = "LICENSE"}
keywords = ["flutter", "release", "firebase", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
]

[project.urls]
Homepage = "https://github.com/MrShakila/F-ship"
Repository = "https://github.com/MrShakila/F-ship"
Issues = "https://github.com/MrShakila/F-ship/issues"

[project.scripts]
fship = "fship.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fship"]
